spring.application.name=vegetable_shop

spring.datasource.url=jdbc:mysql://localhost:3306/vegetable-shop?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=rootpass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.default_batch_fetch_size=100


spring.security.oauth2.resourceserver.jwt.issuer-uri: http://localhost:9090/realms/vegetableshop