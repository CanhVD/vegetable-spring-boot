services:
  app:
    image: java-spring:v1
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/vegetable-shop?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: rootpass
      SPRING_jPA_HIBERNATE_DDL-AUTO: update
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER-URI: http://keyclock:8080/realms/vegetableshop
    depends_on:
      - db
    networks:
      - app-network

  db:
    image: mysql:8.0.44-debian
    restart: always
    ports:
      - "3306:3306"
    volumes:
      - ./.docker/data/db:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: vegetable-shop
    networks:
      - app-network

networks:
  app-network:
    external: true